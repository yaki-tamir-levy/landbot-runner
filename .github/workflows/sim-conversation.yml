name: SIM Conversation (manual)

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: "Number of rounds"
        required: true
        default: "10"
      rules_key:
        description: "Patient rules prompt key"
        required: true
        default: "nlp_sim_patient_rules"
        type: choice
        options:
          - nlp_sim_patient_rules
          - nlp_sim_patient_rules_terse
          - nlp_sim_patient_rules_agreeable
      patient_phone:
        description: "Simulated patient phone"
        required: true
        default: "9990000002"
      round_delay:
        description: "Seconds between rounds"
        required: true
        default: "3"
  schedule:
    # All times are UTC. GitHub Actions has no timezone support.
    # Minutes are 03/13/23 on purpose: round-hour slots are the most congested
    # and GitHub delays them. Summer (IDT): 07/10/13 UTC = 10:00/13:00/16:00 Israel.
    # WINTER (IST): these land one hour later in Israel. Update then.
    - cron: "3 7 * * *"
    - cron: "13 7 * * *"
    - cron: "23 7 * * *"
    - cron: "3 10 * * *"
    - cron: "13 10 * * *"
    - cron: "23 10 * * *"
    - cron: "3 13 * * *"
    - cron: "13 13 * * *"
    - cron: "23 13 * * *"

concurrency:
  group: sim-conversation
  cancel-in-progress: false

jobs:
  run-sim:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve patient for this run
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "phone=${{ inputs.patient_phone }}" >> $GITHUB_OUTPUT
            echo "rules=${{ inputs.rules_key }}" >> $GITHUB_OUTPUT
            echo "rounds=${{ inputs.rounds }}" >> $GITHUB_OUTPUT
            echo "delay=${{ inputs.round_delay }}" >> $GITHUB_OUTPUT
          else
            SCHED="${{ github.event.schedule }}"
            MIN="${SCHED%% *}"
            echo "triggered by cron: $SCHED (minute field: $MIN)"
            case "$MIN" in
              3)  echo "phone=9990000002" >> $GITHUB_OUTPUT
                  echo "rules=nlp_sim_patient_rules" >> $GITHUB_OUTPUT ;;
              13) echo "phone=9990000003" >> $GITHUB_OUTPUT
                  echo "rules=nlp_sim_patient_rules_terse" >> $GITHUB_OUTPUT ;;
              23) echo "phone=9990000004" >> $GITHUB_OUTPUT
                  echo "rules=nlp_sim_patient_rules_agreeable" >> $GITHUB_OUTPUT ;;
              *)  echo "unexpected cron minute: $MIN" >&2
                  exit 1 ;;
            esac
            echo "rounds=10" >> $GITHUB_OUTPUT
            echo "delay=3" >> $GITHUB_OUTPUT
          fi

      - name: Run simulated conversation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LANDBOT_WEBHOOK_SECRET: ${{ secrets.LANDBOT_WEBHOOK_SECRET }}
          SIM_ROUNDS: ${{ steps.pick.outputs.rounds }}
          SIM_RULES_KEY: ${{ steps.pick.outputs.rules }}
          SIM_PATIENT_PHONE: ${{ steps.pick.outputs.phone }}
          SIM_ROUND_DELAY: ${{ steps.pick.outputs.delay }}
          PYTHONUNBUFFERED: "1"
        run: python tools/sim_conversation.py
