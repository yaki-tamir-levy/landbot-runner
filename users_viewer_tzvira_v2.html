    body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}

    input::placeholder{color:#9ca3af}
    button{cursor:pointer}
    /* Click feedback: paint clicked buttons light blue */
    .btn-clicked{ background:#dbeafe !important; border-color:#93c5fd !important; }

  display:flex;
  flex-wrap:wrap;
  align-items:center;

  background:#fafafa;

  border-bottom:1px solid #e5e7eb
}
.patient-name{font-weight:900;font-size:1.35rem;}
    .patient-phone{font-weight:400;font-size:0.9rem;color:var(--muted);}

    .head-sep{font-weight:400;font-size:0.9rem;color:var(--muted);}
    .btn-toggle,.btn-summarized_linked_talk,.btn-raw-summary,.btn-home{
      font-weight:700; border:2px solid #d1d5db; border-radius:10px; padding:8px 10px; background:#fff; min-width:140px; text-align:center

    .btn-state-active{ background:#dcfce7; border-color:#bbf7d0; }

</style>

<script>

<script>
(async function () {
  "use strict";

  function flashClickedButton(ev){
    try{
      var b = ev && ev.target ? ev.target.closest('button') : null;
      if (!b) return;
      b.classList.add('btn-clicked');
      setTimeout(function(){ try{ b.classList.remove('btn-clicked'); }catch(e){} }, 900);
    }catch(e){}
  }
  document.addEventListener('click', flashClickedButton, true);


  function $(id){ return document.getElementById(id); }
  var el = {
    fPhone:$("fPhone"), fName:$("fName"), fFrom:$("fFrom"), fTo:$("fTo"), fKind:$("fKind"),
    btnRun:$("btnRun"), btnClear:$("btnClear"),
    out:$("out"), alertHost:$("alertHost"), statusBar:$("statusBar"), countInfo:$("countInfo"),
    btnOldToggle:$("btnOldToggle"), oldHint:$("oldHint"),
    btnHideSeen:$("btnHideSeen")
  };

  // Hide old rows by default (older than 30 days from page load)
  // Date-only logic: ignore hours/minutes/seconds.
  var PAGE_LOADED_DAY_MS = (function(){
    var d = new Date();
    d.setHours(0,0,0,0);
    return d.getTime();
  })();
  var SHOW_OLD = false;
  var OLD_DAYS = 30;

  // Hide talks that were marked hidden AND carry no open risk.
  // Off by default: the viewer keeps showing every row until the user asks.
  var HIDE_SEEN = false;

  function _parseTimeKeyToDayMs(timeKey){
    // Date-only parsing (ignore time): supports
    // - '2026-01-16 19:01:00.720000+00'
    // - '2026-01-16T19:01:00.720000+00:00'
    // - '2025.11.03 20:27:50:264910'
    try{
      var s = String(timeKey || '').trim();
      if (!s) return null;

      // Capture leading date only: YYYY-MM-DD or YYYY.MM.DD
      var m = s.match(/^(\d{4})[\.-](\d{2})[\.-](\d{2})/);
      if (!m) return null;

      var y = parseInt(m[1], 10);
      var mo = parseInt(m[2], 10);
      var d = parseInt(m[3], 10);
      if (!isFinite(y) || !isFinite(mo) || !isFinite(d)) return null;

      // Local midnight for the extracted date.
      return new Date(y, mo - 1, d).getTime();
    } catch(e){
      return null;
    }
  }

  function _isTooOld(timeKey){
    var dayMs = _parseTimeKeyToDayMs(timeKey);
    if (dayMs == null) return false; // if unknown, don't hide
    var cutoff = PAGE_LOADED_DAY_MS - (OLD_DAYS * 24 * 60 * 60 * 1000);
    return dayMs < cutoff;
  }

  function _syncOldToggleUi(){
    try{
      if (!el.btnOldToggle) return;
      var filteringOld = !SHOW_OLD;
      el.btnOldToggle.textContent = SHOW_OLD ? 'הסתר שיחות ישנות' : 'הצג שיחות ישנות';
      // Emphasize the button when filtering old rows (default state)
      if (filteringOld){
        el.btnOldToggle.classList.add('btn-old-primary');
      } else {
        el.btnOldToggle.classList.remove('btn-old-primary');
      }
      // Show hint only when filtering is active
      if (el.oldHint){
        el.oldHint.style.display = filteringOld ? 'block' : 'none';
      }
    } catch(e){}
  }

  try{
    if (el.btnOldToggle){
      _syncOldToggleUi();
      el.btnOldToggle.addEventListener('click', function(){
        SHOW_OLD = !SHOW_OLD;
        _syncOldToggleUi();
        // rerender using current cache/filters
        if (CACHE && CACHE.loaded){ rerenderFromCache(); }
      });
    }
  } catch(e){}

  function _syncHideSeenUi(){
    try{
      if (!el.btnHideSeen) return;
      el.btnHideSeen.textContent = HIDE_SEEN ? 'הצג שיחות שנצפו' : 'הסתר שיחות שנצפו';
      // Same convention as btnOldToggle: emphasize the button while it is filtering.
      if (HIDE_SEEN){
        el.btnHideSeen.classList.add('btn-old-primary');
      } else {
        el.btnHideSeen.classList.remove('btn-old-primary');
      }
    } catch(e){}
  }

  try{
    if (el.btnHideSeen){
      _syncHideSeenUi();
      el.btnHideSeen.addEventListener('click', function(){
        HIDE_SEEN = !HIDE_SEEN;
        _syncHideSeenUi();
        // rerender using current cache/filters
        if (CACHE && CACHE.loaded){ rerenderFromCache(); }
      });
    }
  } catch(e){}

  // default date range: To = today (leave empty = ALL)
  try{
    if (!el.fTo.value || String(el.fTo.value).trim() === '2025.12.31'){
      el.fTo.value = todayYMD();
    }
  } catch(e){}

  function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(m){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]); }); }
  function setStatusErr(msg){ el.statusBar.innerHTML = msg ? '<div class="err">' + escapeHtml(msg) + '</div>' : ''; }
  function setStatusOk(msg){ el.statusBar.innerHTML = msg ? '<div class="ok">' + escapeHtml(msg) + '</div>' : ''; }

  window.addEventListener('error', function(e){
    var m = 'שגיאת סקריפט: ' + (e && e.message ? e.message : e);
    setStatusErr(m);
  });

  /* Supabase */
  var SUPABASE_URL      = "https://qcwimczsiuxkarwfiyai.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFjd2ltY3pzaXV4a2Fyd2ZpeWFpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTM1OTEwMzgsImV4cCI6MjA2OTE2NzAzOH0.zpMcORTD1voqZFj5QaPUc-EXf1juqnlTTP00jV6_TvI";
  var TABLE             = "users_tzvira_v2";
  var REVIEWS_TABLE     = "risk_reviews_v2";
  var FLAGS_TABLE       = "talk_read_flags";
  var USERS_INFO_TABLE  = "users_information_v2";
  var IDENTITY_TABLE    = "patient_identity_map";

  // Severity is stored lowercase in risk_reviews_v2. Anything outside these three
  // keys - including NULL - leaves the badge, and the summary chip, exactly as it
  // was. Single definition, shared by badgeForHit() and by the alertHost chips.
  var SEVERITY_WORD = { high: 'חמור', medium: 'בינוני', low: 'חלש' };
  // Shown when patient_identity_map fails to load. Name/phone search resolves its
  // needles through identityFromMap, so an empty map means those two filters can
  // never match — the user must be told, not left with a silent empty result.
  var IDENTITY_LOAD_ERR = 'מפת זהות המטופלים לא נטענה — חיפוש לפי שם/טלפון אינו זמין. לחץ "טען" לניסיון נוסף.';

  if (!window.supabase || !window.supabase.createClient){
    setStatusErr('ספריית Supabase לא נטענה (בדוק חיבור אינטרנט / חסימת CDN).');
    return;
  }
  var supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Auth gate: require active Supabase session (set by launcher.html via setSession)
  try {
    const s = await supa.auth.getSession();
    if (!s || !s.data || !s.data.session) {
      window.location.href = 'launcher_v2.html?return_to=' + encodeURIComponent('users_viewer_tzvira_v2.html' + (window.location.search || ''));
      return;
    }
  } catch (e) {
    window.location.href = 'launcher_v2.html?return_to=' + encodeURIComponent('users_viewer_tzvira_v2.html' + (window.location.search || ''));
    return;
  }



  // ------------------------------------------------------------
  // users_information_v2.status backfill — at most one DB call per patient_code
  // Goal: never show "לא ידוע" if the status exists in users_information_v2.
  // ------------------------------------------------------------
  var UI_STATUS_FETCH = new Map(); // patient_code -> Promise<any|null>

  // UNUSED as of the patient_code migration: status lookup no longer matches by phone.
  // Kept intentionally (not deleted) in case a phone-based lookup is needed again.
  function uiPhoneVariants(rawPhone){
    var s = String(rawPhone == null ? '' : rawPhone).trim();
    var digits = s.replace(/\D+/g,'');
    var set = new Set();
    if (digits) set.add(digits);

    if (digits.length === 9) set.add('0' + digits);
    if (digits.length === 10 && digits.charAt(0) === '0'){
      set.add(digits.slice(1));
      set.add('972' + digits.slice(1));
    }

    if (digits.startsWith('972') && digits.length >= 11){
      var rest = digits.slice(3);
      if (rest.length === 9) set.add('0' + rest);
      if (rest.length === 10) set.add(rest);
      set.add(rest);
    }

    if (/^\d+$/.test(s)) set.add(s);
    return Array.from(set).filter(function(x){ return x && String(x).trim() !== ''; });
  }

  function hasInfoStatus(patientCode){
    try{
      var k = String(patientCode == null ? '' : patientCode).trim();
      if (!k) return false;
      var info = CACHE && CACHE.infoMap ? CACHE.infoMap.get(k) : null;
      return !!(info && info.status != null && String(info.status).trim() !== '');
    } catch(e){
      return false;
    }
  }

  function fetchUsersInformationStatusOnce(patientCode){
    var key = String(patientCode == null ? '' : patientCode).trim();
    // No patient_code -> no request at all, and never fall back to phone.
    if (!key) return Promise.resolve(null);
    if (UI_STATUS_FETCH.has(key)) return UI_STATUS_FETCH.get(key);

    // if already present in cache, don't hit DB
    if (hasInfoStatus(key)){
      var p0 = Promise.resolve(CACHE.infoMap.get(key).status);
      UI_STATUS_FETCH.set(key, p0);
      return p0;
    }

    var p = supa.from(USERS_INFO_TABLE)
      // Direct lookup by patient_code. Replaces the or(phone.eq...) variant matching
      // that produced the 400 error.
      .select('status, patient_code, therapy_track')
      .eq('patient_code', key)
      .limit(1)
      .then(function(res){
        var row = (res && res.data && res.data.length) ? res.data[0] : null;
        // therapy_track is backfilled independently of status: the pill needs it even
        // when status is empty, and putInfoTrack never touches the status field.
        if (row) putInfoTrack(key, row.therapy_track);
        if (row && row.status != null && String(row.status).trim() !== ''){
          // backfill into CACHE.infoMap so filters/labels use it everywhere
          putInfoStatus(key, row.status);
          return row.status;
        }
        return null;
      })
      .catch(function(){
        return null;
      });

    UI_STATUS_FETCH.set(key, p);
    return p;
  }

  function ensureUsersInformationForRows(rows){
    var uniq = new Set(); // patient_code
    (rows || []).forEach(function(r){
      var k = (r && r.patient_code != null) ? String(r.patient_code).trim() : '';
      if (k) uniq.add(k);   // no patient_code -> skip the row entirely
    });

    var ps = [];
    uniq.forEach(function(k){
      if (!hasInfoStatus(k)){
        ps.push(fetchUsersInformationStatusOnce(k));
      }
    });
    return Promise.all(ps);
  }
  function putInfoStatus(patientCode, statusVal){
    var status = statusVal;
    if (status == null || String(status).trim() === '') return;
    // Single canonical key: patient_code. No phone variants, no fallback.
    var k = String(patientCode == null ? '' : patientCode).trim();
    if (!k) return;
    // Merge instead of replace: the entry also carries therapy_track, and the two
    // writers run in either order. Overwriting the whole object would drop the field
    // written first. The status field itself keeps its exact previous semantics.
    try{
      var prev = CACHE.infoMap.get(k) || {};
      prev.status = status;
      CACHE.infoMap.set(k, prev);
    } catch(e){}
  }

  // Same cache entry, same canonical key, separate field: users_information_v2.therapy_track.
  // Stored RAW, exactly as it arrives from the DB — the pill prints it verbatim.
  // Kept as its own writer so putInfoStatus keeps its current name, signature and call sites.
  function putInfoTrack(patientCode, trackVal){
    if (trackVal == null || String(trackVal).trim() === '') return;
    var k = String(patientCode == null ? '' : patientCode).trim();
    if (!k) return;
    try{
      var prev = CACHE.infoMap.get(k) || {};
      prev.therapy_track = trackVal;
      CACHE.infoMap.set(k, prev);
    } catch(e){}
  }

  // ------------------------------------------------------------
  // CACHE MODE (Stage 1):
  // טעינה ראשונית מביאה *את כל הנתונים* (ללא סלקציה) כדי ששום RISK לא יחמוק.
  // לאחר מכן כל סלקציה היא מקומית (ללא רשת), ושיחות עם RISK עוקפות סלקציות.
  // ------------------------------------------------------------
  var CACHE = {
    loaded: false,
    allRows: [],
    flagsMap: new Map(),   // key(time_key, patient_code) -> {is_hidden}
    infoMap:  new Map(),   // patient_code -> {status, therapy_track}
    riskMap:  new Map(),   // key(time_key, patient_code) -> [riskRows]
    riskKeySet: new Set(), // keys time_key+patient_code that have any risk
    riskForceKeySet: new Set(), // keys time_key+patient_code that have risk in status NEW/REVIEWED (VIEWED legacy)
    identityMap: {},       // identityCode(patient_code) -> {name, phone}
    identityLoadFailed: false,  // true only if the patient_identity_map fetch failed
    psychNameMap: {},      // identityCode(patient_code) -> psychologist_name (display only)
    sourceMap: {},         // conversation_id -> conversations_session_v2.source (display only)
    viewerName: '',        // viewer_identity().display_name — title only
    viewerIsAdmin: false   // viewer_identity().is_admin — title only. Fails closed.
  };

  // Single normalization point for every patient_identity_map key.
  // Used by the map build path AND by both lookup helpers, so the key that is stored
  // and the key that is looked up are provably the same string.
  // Intentionally separate from riskKey/keyOf — those are untouched.
  function identityCode(v){
    return String(v == null ? '' : v).trim();
  }

  // Display-only identity resolution.
  // Prefers patient_identity_map; falls back to the row's shadow columns.
  // NEVER used for join keys or write paths — those keep using patient_code.
  function displayIdentity(row){
    var code = identityCode(row ? row.patient_code : '');
    if (code){
      var rec = CACHE.identityMap ? CACHE.identityMap[code] : null;
      if (rec) return { name: rec.name, phone: rec.phone };
    }
    return { name: (row ? row.name : ''), phone: (row ? row.phone : '') };
  }

  // Identity for filtering and dialog labels: patient_identity_map ONLY.
  // Same normalized key as displayIdentity (both go through identityCode), but with
  // NO shadow fallback: a missing map entry yields empty strings, so the phone/name
  // filters simply do not match and the dialog label falls back to its existing
  // default. Never reads r.phone / r.name.
  function identityFromMap(row){
    var code = identityCode(row ? row.patient_code : '');
    var rec = (code && CACHE.identityMap) ? CACHE.identityMap[code] : null;
    return { name: (rec && rec.name != null ? rec.name : ''), phone: (rec && rec.phone != null ? rec.phone : '') };
  }

  // Psychologist name for DISPLAY ONLY, from the psychologist_names_for_viewer RPC.
  // Keyed by the same normalized patient_code as the identity map, via the existing
  // identityCode. Missing code or missing entry -> '' (the caller renders 'לא משויך').
  // Never used for join keys, filters or write paths.
  function psychNameFor(row){
    var code = identityCode(row ? row.patient_code : '');
    if (!code) return '';
    var n = CACHE.psychNameMap ? CACHE.psychNameMap[code] : '';
    return (n == null) ? '' : String(n).trim();
  }

  function fetchAllPaged(tableName, selectCols, orderCol){
    var pageSize = 1000;
    var out = [];
    var offset = 0;

    function step(){
      var q = supa.from(tableName).select(selectCols);
      if (orderCol) q = q.order(orderCol, { ascending: true });
      return q.range(offset, offset + pageSize - 1).then(function(res){
        if (res.error){
          throw new Error('Fetch failed for ' + tableName + ': ' + (res.error.message || 'unknown'));
        }
        var data = res.data || [];
        out = out.concat(data);
        if (data.length < pageSize) return out;
        offset += pageSize;
        return step();
      });
    }
    return step();
  }

  
  function riskKey(id, time_key, patient_code){
    // RISK attachment key: time_key + patient_code only.
    // id is intentionally ignored because users_tzvira.id can repeat across talks.
    // Missing patient_code -> empty key. Every caller MUST skip an empty key
    // instead of building a wrong one.
    var code = String(patient_code == null ? '' : patient_code).trim();
    if (!code) return '';
    return String(time_key||'') + '|' + code;
  }

  function buildRiskCache(allRisk){
    CACHE.riskMap = new Map();   // time_key+patient_code -> [riskRows]
    CACHE.riskKeySet = new Set();    // keys that have any risk
    CACHE.riskForceKeySet = new Set(); // keys that have risk in status NEW/REVIEWED (VIEWED legacy)
    (allRisk || []).forEach(function(rr){
      if (String(rr && rr.match_method || '').trim() !== '1') return;
      var k = riskKey(rr && rr.id, rr && rr.time_key, rr && rr.patient_code);
      if (!k) return;   // no patient_code -> skip this row, never build a wrong key
      if (!String(rr && rr.id || '').trim()) return;
      CACHE.riskKeySet.add(k);
      // _forceRisk should be true only if there is at least one unhandled/needs-attention risk
      // NEW or REVIEWED. VIEWED is treated as REVIEWED for backward compatibility.
      try{
        var st = String(rr.status || 'NEW').trim().toUpperCase();
        if (st === 'NEW' || st === 'REVIEWED' || st === 'VIEWED') CACHE.riskForceKeySet.add(k);
      }catch(e){}
      var arr = CACHE.riskMap.get(k);
      if (!arr){ arr = []; CACHE.riskMap.set(k, arr); }
      arr.push(rr);
    });
  }

  function markRowsWithRisk(){
    (CACHE.allRows || []).forEach(function(r){
      var k = riskKey(r && r.id, r && r.time_key, r && r.patient_code);
      if (!k){ r._hasRisk = false; r._forceRisk = false; return; }  // no patient_code -> skip
      r._hasRisk   = CACHE.riskKeySet.has(k);
      // _forceRisk: override client-side filters only when risk status is NEW/REVIEWED (VIEWED legacy).
      r._forceRisk = CACHE.riskForceKeySet.has(k);
    });
  }

  function loadAllDataFromServer(){
    setStatusErr('');
    setStatusOk('טעינה ראשונית: מביא את כל השיחות ללא סלקציה…');

    CACHE.loaded = false;
    CACHE.allRows = [];
    CACHE.flagsMap = new Map();
    CACHE.infoMap = new Map();
    CACHE.riskMap = new Map();
    CACHE.riskKeySet = new Set();
    CACHE.riskForceKeySet = new Set();
    CACHE.identityMap = {};
    CACHE.identityLoadFailed = false;
    CACHE.psychNameMap = {};
    CACHE.sourceMap = {};
    CACHE.viewerName = '';
    CACHE.viewerIsAdmin = false;

    // conversation_id is fetched here because the header pill resolves the conversation
    // source through CACHE.sourceMap, which is keyed by it. Without it every row would
    // read as 'לא ידוע'.
    return fetchAllPaged(TABLE, 'id, time_key, patient_code, conversation_id, last_talk_tzvira, summarized_linked_talk', 'time_key')
      .then(function(allRows){
        CACHE.allRows = allRows || [];
        setStatusOk('נטענו ' + CACHE.allRows.length + ' שיחות. טוען RISK…');
        return fetchAllPaged(REVIEWS_TABLE, 'id, time_key, phone, patient_code, line_num, status, reviewed_at, reviewer, name, review_notes, severity, match_method, risk_reasons, short_risk', 'id');
      })
      .then(function(allRisk){
        buildRiskCache(allRisk || []);
        markRowsWithRisk();
        setStatusOk('RISK נטען (צמדים=' + CACHE.riskKeySet.size + '). טוען דגלי הסתרה…');
        return fetchAllPaged(FLAGS_TABLE, 'time_key, patient_code, is_hidden', 'time_key');
      })
      .then(function(allFlags){
        (allFlags || []).forEach(function(fr){
          var fk = keyOf(fr.time_key, fr.patient_code);
          if (!fk) return;   // no patient_code -> skip, never build a wrong key
          CACHE.flagsMap.set(fk, { is_hidden: !!fr.is_hidden });
        });
        setStatusOk('דגלי הסתרה נטענו (' + CACHE.flagsMap.size + '). טוען סטטוסים…');
        return fetchAllPaged(USERS_INFO_TABLE, 'patient_code, status, therapy_track', 'patient_code');
      })
      .then(function(allInfo){
        (allInfo || []).forEach(function(ir){
          putInfoStatus(ir.patient_code, ir.status);
          putInfoTrack(ir.patient_code, ir.therapy_track);
        });
        // CACHE.loaded is intentionally NOT set here. The identity map is still missing
        // at this point, and every filter trigger in the UI gates on CACHE.loaded.
        // See the identity stage below.
        setStatusOk('סטטוסים נטענו. טוען מפת זהות מטופלים…');
      })
      .then(function(){
        // The identity map is part of the readiness contract: CACHE.loaded is set ONLY
        // after this stage settles, because the phone/name filters resolve their
        // needles through identityFromMap. Both branches must set it, otherwise a
        // failed identity fetch would leave the whole viewer permanently "not loaded".
        return supa.rpc('rpc_get_users_tzvira_v2_viewer')
          .then(function(res){
            if (res && res.error) throw res.error;
            var allIdentity = (res && res.data) ? res.data : [];
            (allIdentity || []).forEach(function(ir){
              if (!ir) return;
              var code = identityCode(ir.patient_code);
              if (!code) return;
              CACHE.identityMap[code] = { name: ir.name, phone: ir.phone };
            });
            console.log('identityMap entries: ' + Object.keys(CACHE.identityMap).length);
            CACHE.identityLoadFailed = false;
            CACHE.loaded = true;
            setStatusOk('טעינה ראשונית הושלמה. סלקציות כעת מקומיות.');
          })
          .catch(function(e){
            console.warn('identityMap load failed: ' + (e && e.message ? e.message : e));
            // Soft-fail is preserved: talks, RISK, flags and statuses are already in
            // cache, so the viewer stays usable. Only name/phone search is dead, and
            // that is now stated explicitly instead of console-only.
            CACHE.identityLoadFailed = true;
            CACHE.loaded = true;
            setStatusErr(IDENTITY_LOAD_ERR);
          });
      })
      .then(function(){
        // ADDITIVE, display-only: psychologist names via the SECURITY DEFINER RPC
        // psychologist_names_for_viewer(). The RPC itself restricts the rows to what
        // the signed-in user may see (admin = all, psychologist = own patients), so
        // the psychologist table is never exposed to the browser and no filtering
        // happens client-side.
        // Soft-fail exactly like the identity map: on any failure the map stays empty
        // and the badge reads 'לא משויך'. This must never break the load, and it is
        // never consulted by a filter, a join key or a write path.
        return supa.rpc('psychologist_names_for_viewer')
          .then(function(res){
            if (res && res.error) throw res.error;
            var rows = (res && res.data) ? res.data : [];
            rows.forEach(function(pr){
              if (!pr) return;
              var code = identityCode(pr.patient_code);
              if (!code) return;
              CACHE.psychNameMap[code] = (pr.psychologist_name == null) ? '' : String(pr.psychologist_name);
            });
            console.log('psychNameMap entries: ' + Object.keys(CACHE.psychNameMap).length);
          })
          .catch(function(e){
            console.warn('psychNameMap load skipped: ' + (e && e.message ? e.message : e));
          });
      })
      .then(function(){
        // ADDITIVE, display-only: conversation source via the SECURITY DEFINER RPC
        // conversation_sources_for_viewer(). The RPC restricts the rows to what the
        // signed-in user may see (admin = all, psychologist = own patients), so
        // conversations_session_v2 is never exposed to the browser and no filtering
        // happens client-side.
        // Soft-fail exactly like psychNameMap: on any failure the map stays empty and
        // the pill falls back to 'לא ידוע'. This must never break the load, and it is
        // never consulted by a filter, a join key or a write path.
        return supa.rpc('conversation_sources_for_viewer')
          .then(function(res){
            if (res && res.error) throw res.error;
            var rows = (res && res.data) ? res.data : [];
            rows.forEach(function(cr){
              if (!cr) return;
              var cid = String(cr.conversation_id == null ? '' : cr.conversation_id).trim();
              if (!cid) return;
              CACHE.sourceMap[cid] = (cr.source == null) ? '' : String(cr.source);
            });
            console.log('sourceMap entries: ' + Object.keys(CACHE.sourceMap).length);
          })
          .catch(function(e){
            console.warn('sourceMap load skipped: ' + (e && e.message ? e.message : e));
          });
      })
      .then(function(){
        // ADDITIVE, display-only: who is signed in, via the SECURITY DEFINER RPC
        // viewer_identity() -> (display_name text, is_admin boolean). It decides the page
        // title only. It is NOT a security boundary: row visibility is already enforced
        // server-side by the RPCs and by RLS.
        // Soft-fail exactly like the two stages above, and FAIL CLOSED: any error leaves
        // viewerName '' and viewerIsAdmin false, so the title falls back to the neutral
        // 'כל השיחות' rather than naming the wrong person. This must never break the load.
        return supa.rpc('viewer_identity')
          .then(function(res){
            if (res && res.error) throw res.error;
            var rows = (res && res.data) ? res.data : [];
            var vr = rows.length ? rows[0] : null;
            CACHE.viewerName = (vr && vr.display_name != null) ? String(vr.display_name) : '';
            CACHE.viewerIsAdmin = !!(vr && vr.is_admin === true);
            console.log('viewer_identity: is_admin=' + CACHE.viewerIsAdmin + ', display_name=' + CACHE.viewerName);
          })
          .catch(function(e){
            console.warn('viewer_identity load skipped: ' + (e && e.message ? e.message : e));
            CACHE.viewerName = '';
            CACHE.viewerIsAdmin = false;
          })
          .then(function(){
            // Applied on BOTH paths, success and failure: the title must reflect
            // whoever is signed in, and on failure that is the fail-closed default.
            updateTitlesFromStatus();
          });
      })
      .catch(function(e){
        setStatusErr('שגיאת טעינה: ' + (e && e.message ? e.message : e));
        throw e;
      });
  }

  function getFilteredRowsFromCache(){
    var phoneNeedle = (el.fPhone.value || '').trim();
    var nameNeedle  = (el.fName.value  || '').trim();
    var f = (el.fFrom.value || '').trim();
    var t = (el.fTo.value   || '').trim();

    var fromTime = isYL(f) ? (f + '-00.00.00') : null;
    var toTime   = isYL(t) ? (t + '-23.59.59') : null;

    var pnLow = phoneNeedle ? phoneNeedle.toLowerCase() : '';
    var nnLow = nameNeedle  ? nameNeedle.toLowerCase()  : '';

    var out = [];
    (CACHE.allRows || []).forEach(function(r){
      if (r && r._forceRisk){ out.push(r); return; }

      if (!SHOW_OLD && _isTooOld(r.time_key)) return;

      if (pnLow || nnLow){
        var idf = identityFromMap(r);
        if (pnLow && String(idf.phone || '').toLowerCase().indexOf(pnLow) === -1) return;
        if (nnLow && String(idf.name  || '').toLowerCase().indexOf(nnLow) === -1) return;
      }
      if (fromTime && String(r.time_key||'') < fromTime) return;
      if (toTime   && String(r.time_key||'') > toTime)   return;

      out.push(r);
    });

    out.sort(function(a,b){
      var ta = String(a.time_key||''), tb = String(b.time_key||'');
      if (ta < tb) return -1;
      if (ta > tb) return 1;
      var pa = String(a.phone||''), pb = String(b.phone||'');
      if (pa < pb) return -1;
      if (pa > pb) return 1;
      return 0;
    });

    return out;
  }

  function rerenderFromCache(){
    if (!CACHE.loaded){
      setStatusOk('הנתונים עדיין לא נטענו. לחץ "טען".');
      return;
    }
    setStatusErr('');
    setStatusOk('מרנדר מקומית…');
    // Effective kind: the six-value whitelist applied to the select value.
    var talkKind = currentKind();
    var rows = getFilteredRowsFromCache();

    ensureUsersInformationForRows(rows).then(function(){
      return render(rows, CACHE.flagsMap, CACHE.infoMap, talkKind);
    }).then(function(info){
      el.countInfo.textContent = 'מציג ' + (info.patientsCount||0) + ' מטופלים · ' + (info.shownCount||0) + ' שיחות פתוחות · ' + (info.hiddenCount||0) + ' שיחות מוסתרות';
      // setStatusOk/setStatusErr overwrite the same status bar, so the identity-load
      // error must be re-asserted here or the render would silently wipe it.
      if (CACHE.identityLoadFailed){ setStatusErr(IDENTITY_LOAD_ERR); }
      else { setStatusOk('מוכן.'); }
    }).catch(function(e){
      setStatusErr('שגיאת רינדור: ' + (e && e.message ? e.message : e));
    });
  }
  // The localStorage key keeps its old name on purpose, so an existing browser profile is
  // not orphaned. Its stored value, however, is now one of the six below; the old values
  // ("", "1".."4") are no longer valid and normalizeKind() maps them to 'all'.
  var LS_STATUS_KEY = 'uvr_status_filter';

  // The six conversation-kind values, in the order they appear in #fKind. Also the
  // whitelist: anything not in this list is treated as 'all'.
  var KIND_VALUES = ['all', 'course', 'clinic', 'nlp', 'risk_open', 'risk_any'];

  var STATUS_TITLE_MAP = {
    "all":       "כל השיחות",
    "course":    "שיחות הדרכת קורס מסע הגיבור",
    "clinic":    "שיחה קלינית",
    "nlp":       "שיחת NLP",
    "risk_open": "סיכונים שלא טופלו",
    "risk_any":  "סיכונים שנמצאו"
  };

  function normalizeKind(v){
    var s = String(v == null ? '' : v).trim();
    return (KIND_VALUES.indexOf(s) === -1) ? 'all' : s;
  }

  // The EFFECTIVE filter. Every signed-in user's selection takes effect; the only
  // normalisation is the six-value whitelist.
  function currentKind(){
    return normalizeKind(el.fKind ? el.fKind.value : 'all');
  }

  // Title for both the <title> tag and the <h2>. The five explicit kinds read the same
  // for everyone. Only 'all' differs: an admin sees every conversation, a psychologist
  // sees their own patients and is told so by name.
  function updateTitlesFromStatus() {
    var kind = normalizeKind(el.fKind ? el.fKind.value : 'all');
    var vn = String(CACHE.viewerName == null ? '' : CACHE.viewerName).trim();
    var fullTitle;
    if (kind === 'all' && !CACHE.viewerIsAdmin && vn){
      fullTitle = 'שיחות של מטופלי ' + vn;
    } else {
      fullTitle = Object.prototype.hasOwnProperty.call(STATUS_TITLE_MAP, kind) ? STATUS_TITLE_MAP[kind] : 'כל השיחות';
    }
    document.title = fullTitle;
    var h2 = $("pageTitle");
    if (h2) h2.textContent = fullTitle;
  }

  try {
    if (window.localStorage) {
      var savedStatus = localStorage.getItem(LS_STATUS_KEY);
      // A stored value from the old status filter ("", "1".."4"), or any other unknown
      // string, resolves to 'all' instead of selecting nothing.
      if (savedStatus !== null) el.fKind.value = normalizeKind(savedStatus);
    }
  } catch(e) {}

  var LIMIT = 100;

  function isYL(s){ return /^\d{4}\.\d{2}\.\d{2}$/.test(s||''); }

  function todayYMD(){
    // מתאים ל-<input type="date"> (YYYY-MM-DD)
    try{
      var d = new Date();
      var y = d.getFullYear();
      var m = String(d.getMonth()+1).padStart(2,'0');
      var day = String(d.getDate()).padStart(2,'0');
      return y + '-' + m + '-' + day;
    }catch(e){
      return '';
    }
  }

  // Single source of truth for users_information_v2.status -> display label.
  // Keys are strings; lookup normalizes the incoming value first, so 4 and '4' resolve identically.
  var STATUS_LABEL_MAP = {
    "1": "מטופל",
    "2": "קורסיסט",
    "3": "מטופל קורסיסט",
    "4": "פיקטיבי - לשני הסוגים"
  };

  // תווית למצב משתמש שמגיע מ-users_information_v2.status
  function statusLabel(statusVal){
    if (statusVal == null) return 'לא ידוע';
    var s = String(statusVal).trim();
    if (!s) return 'לא ידוע';

    // s is already a trimmed string, so a numeric 4 and the string '4' both arrive here as "4".
    if (Object.prototype.hasOwnProperty.call(STATUS_LABEL_MAP, s)) return STATUS_LABEL_MAP[s];

    // Not 1-4 -> unchanged existing default: return the value as-is.
    return s;
  }

function stripAllHtml(raw){
    var s = String(raw==null?'':raw);
    s = s.replace(/<br\s*\/?>(?=\s*)/gi, '\n');
    s = s.replace(/<\/?.*?>/g, '');
    return s;
  }
  function normalizeWs(raw){
    return String(raw==null?'':raw)
      .replace(/[\u200e\u200f\u202a-\u202e\u200b]/g,'')
      .replace(/\u00a0/g,' ')
      .replace(/\r/g,'')
      .replace(/[ \t]+\n/g, '\n')
      .replace(/\n{2,}/g, '\n');
  }
  function cleanTalk(raw){ return normalizeWs(stripAllHtml(raw)); }

  function b64Enc(str){ try{ return btoa(unescape(encodeURIComponent(String(str||'')))); }catch(e){ return ''; } }
  function b64Dec(str){ try{ return decodeURIComponent(escape(atob(String(str||'')))); }catch(e){ return ''; } }

  function sliceSummaryFromLastMarker(summary){
    var s = String(summary||'');
    if (!s) return s;
    var lines = s.split(/\n/);
    var lastIdx = -1;
    var rx = /^\s*(\d{2}\/\d{2}\/\d{4})\s*-\s*(\d{8}T\d{6}Z)\s*$/;
    for (var i=0;i<lines.length;i++){
      if (rx.test(lines[i])) lastIdx = i;
    }
    if (lastIdx === -1) return s;
    return lines.slice(lastIdx).join('\n');
  }

  function timeKeyToHuman(k){
    // Display only: convert DB timestamps from UTC (+00) to Israel time.
    // Does not change filtering, matching, Supabase queries, or stored data.
    try{
      var s = String(k || '').trim();
      if (!s) return '';

      var iso = s;

      // PostgreSQL timestamptz example:
      // 2026-05-11 07:00:54.680000+00
      // JS Date needs ISO-like T and a timezone offset in +00:00 form.
      iso = iso.replace(' ', 'T');
      iso = iso.replace(/(\.\d{3})\d+/, '$1');
      iso = iso.replace(/([+-]\d{2})$/, '$1:00');

      var d = new Date(iso);
      if (isNaN(d.getTime())) return s;

      var parts = new Intl.DateTimeFormat('he-IL', {
        timeZone: 'Asia/Jerusalem',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      }).formatToParts(d);

      function part(type){
        var item = parts.find(function(x){ return x.type === type; });
        return item ? item.value : '';
      }

      return part('day') + '.' + part('month') + '.' + part('year') + ' ' +
             part('hour') + ':' + part('minute') + ':' + part('second');
    } catch(e){
      return String(k || '');
    }
  }

  function escapeRegExp(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
  function ilStamp(ts){
    try{ return new Date(ts).toLocaleString('he-IL', { timeZone: 'Asia/Jerusalem', hour12: false }); }
    catch(e){ return ts; }
  }
  function nowISO(){ return new Date().toISOString(); }
  // UNUSED as of the patient_code migration: no join key or lookup matches by phone anymore.
  // Kept intentionally (not deleted) in case a phone-based lookup is needed again.
  function normPhone(p){
    var s = String(p == null ? '' : p);
    // keep digits only
    var d = s.replace(/\D+/g,'');
    if (!d) return s.trim();

    // normalize Israel +972XXXXXXXXX -> 0XXXXXXXXX when possible
    if (d.startsWith('972') && d.length >= 11){
      var rest = d.slice(3);
      if (rest.length === 9) return '0' + rest;
      if (rest.length === 10 && rest.startsWith('0')) return rest;
      return rest;
    }

    // normalize Israel numbers missing leading 0 (e.g. 526010111 -> 0526010111)
    if (d.length === 9){
      return '0' + d;
    }

    return d;
  }

  // -------------------------------
  // דיאלוג לפורמטים שונים (שם מטופל/ת, "המטפל:", Q/A, וכו')
  // -------------------------------
  function toDialogLines(name, rawText){
    var patient = (name && String(name).trim()) ? String(name).trim() : 'מטופל/ת';

    var tsPrefix = '\\s*(?:\\[[^\\]]*\\]\\s*)?';
    var rxPatientName = new RegExp('^' + tsPrefix + escapeRegExp(patient) + ':\\s*');
    var rxTher = new RegExp('^' + tsPrefix + 'המטפל:\\s*');
    var rxQ = new RegExp('^' + tsPrefix + 'Q:\\s*', 'i');
    var rxA = new RegExp('^' + tsPrefix + 'A:\\s*', 'i');
    var rxGenericPatient = new RegExp('^' + tsPrefix + '(?:המטופל|מטופל\\/ת|מטופל):\\s*');
    var rxGenericTher = new RegExp('^' + tsPrefix + '(?:המטפל):\\s*');

    var lines = String(rawText||'').split(/\n/);
    var out = [];

    for (var i=0;i<lines.length;i++){
      var s0 = String(lines[i]||'');

      // Preserve original line number prefix like: "-1- Q: ..." / "-2- A: ..."
      // This number is used for anchoring to risk_reviews.line_num / risk_reviews.page_num.
      var lnNum = null;
      var mNum = /^\s*-\s*(\d+)\s*-\s*(.*)$/.exec(s0);
      var s = s0;
      var numPrefix = '';
      if (mNum){
        lnNum = parseInt(mNum[1], 10);
        if (!isFinite(lnNum) || lnNum < 1){ lnNum = null; }
        s = String(mNum[2]||'');
      }

      if (rxPatientName.test(s)){ out.push({ speaker:'patient', body: s.replace(rxPatientName,''), _lineNum: lnNum }); continue; }
      if (rxTher.test(s)){ out.push({ speaker:'therapist', body: s.replace(rxTher,''), _lineNum: lnNum }); out.push({ speaker:'spacer' }); continue; }
      if (rxQ.test(s)){ out.push({ speaker:'patient', body: s.replace(rxQ,''), _lineNum: lnNum }); continue; }
      if (rxA.test(s)){ out.push({ speaker:'therapist', body: s.replace(rxA,''), _lineNum: lnNum }); out.push({ speaker:'spacer' }); continue; }
      if (rxGenericPatient.test(s)){ out.push({ speaker:'patient', body: s.replace(rxGenericPatient,''), _lineNum: lnNum }); continue; }
      if (rxGenericTher.test(s)){ out.push({ speaker:'therapist', body: s.replace(rxGenericTher,''), _lineNum: lnNum }); out.push({ speaker:'spacer' }); continue; }

      if (/^\s*שאלה:\s*/.test(s)){ out.push({ speaker:'patient', body: s.replace(/^\s*שאלה:\s*/,''), _lineNum: lnNum }); continue; }
      if (/^\s*תשובה:\s*/.test(s)){ out.push({ speaker:'therapist', body: s.replace(/^\s*תשובה:\s*/,''), _lineNum: lnNum }); out.push({ speaker:'spacer' }); continue; }

      out.push({ speaker:'text', body: s, _lineNum: lnNum });
    }
    return { patient: patient, lines: out };
  }

  function loadRiskRows(talk_id, time_key, phone, patient_code){
    if (CACHE && CACHE.loaded){
      var k = riskKey(talk_id, time_key, patient_code);
      return Promise.resolve(k ? (CACHE.riskMap.get(k) || []) : []);
    }
    // Server fallback (CACHE not loaded). No patient_code -> no query at all, never fall back to phone.
    if (!String(patient_code == null ? '' : patient_code).trim()) return Promise.resolve([]);
    return supa.from(REVIEWS_TABLE)
      // NOTE: production schema uses LINE_NUM (no page_num)
      .select('id, time_key, phone, patient_code, line_num, status, reviewed_at, reviewer, name, review_notes, severity, match_method, risk_reasons, short_risk')
      .eq('time_key', time_key)
      .eq('patient_code', patient_code)
      .then(function(res){
        if (res.error) return [];
        return res.data || [];
      });
  }


  // ------------------------------------------------------------
  // RISK REVIEW UI: update status / notes (Hebrew statuses)
  // ------------------------------------------------------------
  function updateRiskReviewStatus(talkId, timeKey, phone, lineNum, newStatus, notes, patientCode){
    var stUi = String(newStatus || '').trim();
    if (!timeKey || !lineNum || !stUi) return Promise.resolve(false);
    // HARD GUARD: patient_code is the only patient identifier used for the write.
    // Missing -> the request is never sent, and there is NO fallback to phone.
    var pc = String(patientCode == null ? '' : patientCode).trim();
    if (!pc) return Promise.reject(new Error('חסר מזהה מטופל (patient_code) — העדכון בוטל'));
    var txt = (notes == null) ? '' : String(notes);

    // reviewer has a SINGLE source: the psychologist assigned to this patient.
    // There is no free-text field any more and no fallback. Empty means the patient
    // has no assignment, and then the reviewer column is left untouched rather than
    // being overwritten with an empty string.
    var rnFinal = psychNameFor({ patient_code: pc });


    // UI -> DB status mapping
    // דרישה: לחיצה על "צפיתי" מעדכנת סטטוס ל-REVIEWED
    var stDb = stUi;
    if (stUi === 'צפיתי') stDb = 'REVIEWED';
    if (stUi === 'מבטל סיכון') stDb = 'CHECKED';

    // Some environments might have the column spelled differently (STATUS vs STSTUS).
    // We try STATUS first, then STSTUS.
    function doUpdate(statusVal, colName){
      // No assignment -> reviewer is omitted from the payload entirely, so the
      // existing DB value survives. An assignment -> it is written.
      var upd = { review_notes: txt, reviewed_at: nowISO() };
      if (rnFinal) upd.reviewer = rnFinal;
      upd[colName] = statusVal;
      return supa.from(REVIEWS_TABLE)
        .update(upd)
        .eq('time_key', timeKey)
        .eq('patient_code', pc)
        .eq('line_num', lineNum)
        .select('id')
        .then(function(res){
          if (res && res.error) throw res.error;
          var updated = (res && res.data) ? res.data : [];
          return !!(updated && updated.length);
        });
    }

    function tryColumns(statusVal){
      return doUpdate(statusVal, 'status').catch(function(err){
        var msg = (err && err.message) ? String(err.message) : String(err || '');
        if (msg.toLowerCase().indexOf('column') !== -1 && msg.toLowerCase().indexOf('status') !== -1 && msg.toLowerCase().indexOf('does not exist') !== -1){
          return doUpdate(statusVal, 'ststus');
        }
        throw err;
      });
    }

    // Ensure REVIEWED is valid: try it. If a CHECK constraint blocks it, fallback to VIEWED (legacy) but keep UI stable.
    function tryWithConstraintFallback(){
      return tryColumns(stDb).catch(function(err){
        var msg = (err && err.message) ? String(err.message) : String(err || '');
        var low = msg.toLowerCase();
        var looksLikeChk = (low.indexOf('check constraint') !== -1) || (low.indexOf('_chk') !== -1);
        if (stDb === 'REVIEWED' && looksLikeChk){
          // not valid -> fallback
          return tryColumns('VIEWED').then(function(ok){
            if (ok) stDb = 'VIEWED';
            return ok;
          });
        }
        throw err;
      });
    }

    return tryWithConstraintFallback().then(function(ok){
      if (ok && CACHE && CACHE.loaded){
        var kc = riskKey(talkId, timeKey, pc);
        var arr = kc ? (CACHE.riskMap.get(kc) || []) : [];
        for (var i=0;i<arr.length;i++){
          var rr = arr[i];
          var ln = (rr && rr.line_num);
          if (parseInt(ln,10) === parseInt(lineNum,10) && String(rr.time_key||'') === String(timeKey||'') && String(rr.patient_code||'').trim() === pc){
            rr.status = stDb;
            rr.review_notes = txt;
            rr.reviewed_at = nowISO();
            if (rnFinal) rr.reviewer = rnFinal;
          }
        }
      }
      return ok;
    });
  }

function updateRiskReviewNotes(talkId, timeKey, phone, lineNum, notes, patientCode){
    if (!timeKey || !lineNum) return Promise.resolve(false);
    // HARD GUARD: see updateRiskReviewStatus. No patient_code -> no request, no phone fallback.
    var pc = String(patientCode == null ? '' : patientCode).trim();
    if (!pc) return Promise.reject(new Error('חסר מזהה מטופל (patient_code) — שמירת ההערה בוטלה'));
    var txt = (notes == null) ? '' : String(notes);
    // reviewer has a SINGLE source — see updateRiskReviewStatus. No fallback, and
    // an empty result means the column is left untouched instead of blanked.
    var rn = psychNameFor({ patient_code: pc });

    // Saving a note always updates review_notes. reviewer is included only when the
    // patient has an assigned psychologist, so it is never blanked.
    // It must NOT change status/reviewed_at.
    var updN = { review_notes: txt };
    if (rn) updN.reviewer = rn;
    return supa.from(REVIEWS_TABLE)
      .update(updN)
      .eq('time_key', timeKey)
      .eq('patient_code', pc)
      .eq('line_num', lineNum)
      .select('id')
      .then(function(res){
        if (res && res.error) throw res.error;
        var updated = (res && res.data) ? res.data : [];
        if (updated && updated.length) return true;
        return false;
      })
      .then(function(ok){
        if (ok && CACHE && CACHE.loaded){
          var kc = riskKey(talkId, timeKey, pc);
          var arr = kc ? (CACHE.riskMap.get(kc) || []) : [];
          for (var i=0;i<arr.length;i++){
            var rr = arr[i];
            var ln = (rr && rr.line_num);
            if (parseInt(ln,10) === parseInt(lineNum,10) && String(rr.time_key||'') === String(timeKey||'') && String(rr.patient_code||'').trim() === pc){
              rr.review_notes = txt;
              if (rn) rr.reviewer = rn;
            }
          }
        }
        return ok;
      });
  }

  
  function snippetAround(full, match){
    var s = String(full||''), m = String(match||'');
    if (!m) return s.slice(0, 60);
    var idx = s.indexOf(m);
    if (idx === -1) return (m.length>80? m.slice(0,80)+'…' : m);
    var start = Math.max(0, idx - 18), end = Math.min(s.length, idx + m.length + 18);
    return (start>0?'…':'') + s.slice(start, end).trim() + (end<s.length?'…':'');
  }

  function hashStr(str){
    var h=5381, i=0, cc;
    for (i=0;i<str.length;i++){ cc=str.charCodeAt(i); h=((h<<5)+h) ^ cc; }
    return (h>>>0).toString(16);
  }

  function bindRiskToDialog(dialogLines, talkDomId, riskRows){

  function renderDialogHtml(patientName, dialogLines, hits){
    var html = [];

    function normStatus(st){
      var s = String(st || '').trim();
      return s || 'NEW';
    }

    function isOpenRiskStatus(st){
      var s = normStatus(st);
      // Open risk statuses
      return (s === 'NEW' || s === 'VIEWED' || s === 'REVIEWED');
    }

    function isDeletedRiskStatus(st){
      var s = normStatus(st);
      return (s === 'CHECKED');
    }

    // Map line_num -> hit (prefer open over deleted if multiple)
    var hitByLine = new Map();
    (hits || []).forEach(function(h){
      var ln = parseInt(h.line_num, 10);
      if (!isFinite(ln) || ln < 1) return;
      var prev = hitByLine.get(ln);
      if (!prev){
        hitByLine.set(ln, h);
        return;
      }
      // prefer open status over deleted if duplicates exist
      if (isDeletedRiskStatus(prev.status) && isOpenRiskStatus(h.status)) hitByLine.set(ln, h);
    });

    function lineAttrs(lnObj){
      var attrs = '';
      var cls = 'line speaker';
      var n = (lnObj && lnObj._lineNum != null) ? parseInt(lnObj._lineNum, 10) : NaN;
      var hit = (isFinite(n) && n >= 1) ? hitByLine.get(n) : null;

      if (lnObj && lnObj._anchorId){
        attrs += ' id="' + escapeHtml(lnObj._anchorId) + '"';
      }
      if (hit){
        var st = normStatus(hit.status);
        if (isDeletedRiskStatus(st)) cls += ' risk-line checked';
        else cls += ' risk-line open';
        attrs += ' data-risk="1"';
        attrs += ' data-risk-id="' + escapeHtml(String(hit.id||'')) + '"';
        attrs += ' data-risk-ln="' + escapeHtml(String(n)) + '"';
      }
      attrs += ' class="' + cls + '"';
      return { attrs: attrs, hit: hit, lineNum: n };
    }

    function badgeForHit(hit){
      if (!hit) return '';
      var stDb = normStatus(hit.status);
      var label = 'RISK';
      var cls = 'open';
      if (stDb === 'VIEWED' || stDb === 'REVIEWED') { label = 'צפיתי'; cls = 'open'; }
      if (stDb === 'CHECKED') { label = 'מבטל סיכון'; cls = 'checked'; }
      // The severity word and tint are for the untreated RISK badge only. A badge
      // that already says צפיתי or מבטל סיכון is left untouched.
      if (label === 'RISK'){
        var sev = String(hit.severity || '').trim().toLowerCase();
        var word = SEVERITY_WORD[sev];
        if (word){
          label = 'RISK · ' + word;
          cls += ' sev-' + sev;
        }
      }
      return '<span class="risk-badge ' + cls + '">' + escapeHtml(label) + '</span>';
    }

    // The badge and a full-size "חזרה למסך הראשון" button, on their own row under
    // the transcript line. The button carries the SAME .btn-home class as the one
    // in the talk header and nothing else, so the existing delegated handler on
    // el.out runs it - no new scroll code and no new destination.
    function riskActionsRow(hit){
      if (!hit) return '';
      return '<div class="risk-actions">'
           + badgeForHit(hit)
           + '<button type="button" class="btn-home" title="חזרה למסך הראשון">חזרה למסך הראשון</button>'
           + '</div>';
    }

    function controlsForHit(talkId, lineNum, hit){
      if (!hit) return '';
      var stDb = normStatus(hit.status || 'NEW');
      var stUi = (stDb === 'VIEWED' || stDb === 'REVIEWED') ? 'צפיתי' : ((stDb === 'CHECKED') ? 'מבטל סיכון' : 'NEW');
      var notes = (hit.review_notes != null ? String(hit.review_notes) : '').trim();

      var btnSeenCls = (stUi === 'צפיתי') ? ' rc-btn rc-seen active' : ' rc-btn rc-seen';
      var btnCancelCls = (stUi === 'מבטל סיכון') ? ' rc-btn rc-cancel active' : ' rc-btn rc-cancel';

      // UI labels requirement:
      // - Before click: "צפייה" / "ביטול סיכון"
      // - After click:  "צפיתי" / "ביטלתי סיכון"
      var btnSeenLabel = (stUi === 'צפיתי') ? 'צפיתי' : 'צפייה';
      var btnCancelLabel = (stUi === 'מבטל סיכון') ? 'ביטלתי סיכון' : 'ביטול סיכון';
      var stCurrent = (stUi && stUi !== 'NEW') ? stUi : '';
