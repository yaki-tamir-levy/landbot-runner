        statusLine = '<div class="rc-small">' +
          (stShow ? ('סטטוס: <span class="rc-status">' + escapeHtml(stShow) + '</span>') : '') +
          (notes ? (' · הערה: ' + escapeHtml(notes)) : '') +
        '</div>';
      }

      // Risk-phrase tag, same look and same value as the pill in the top alert banner:
      // risk_reasons first, short_risk as fallback. Value comes from the existing hit
      // object (no extra fetch). Both missing -> render nothing.
      var riskTag = '';
      var srTxt = String((hit && (hit.risk_reasons || hit.short_risk)) || '').trim();
      if (srTxt){
        riskTag = '<div class="rc-row"><span class="pill mono">' + escapeHtml(srTxt) + '</span></div>';
      }

      return (
        '<div class="risk-controls" data-riskctl="1" data-id="' + escapeHtml(String(talkId||'')) + '" data-ln="' + escapeHtml(String(lineNum)) + '">' +
          riskTag +
          '<div class="rc-row">' +
            '<span class="rc-title">אישור מטפל:</span>' +
            '<button class="' + btnSeenCls + '" data-act="risk-status" data-status="צפיתי">' + btnSeenLabel + '</button>' +
            '<button class="' + btnCancelCls + '" data-act="risk-status" data-status="מבטל סיכון">' + btnCancelLabel + '</button>' +
            '<span class="rc-current">' +
              'סטטוס נוכחי: ' + (stCurrent ? ('<span class=\"rc-status\">' + escapeHtml(stCurrent) + '</span>') : '<span class=\"rc-status\">—</span>') +
            '</span>' +
          '</div>' +
          '<div style="margin-top:8px"><label class="hint">הערת מטפל:</label>' +
          '<textarea data-act="risk-note" placeholder="הקלד הערה...">' + escapeHtml(notes) + '</textarea>' +
          '<div style="margin-top:8px"><button class="rc-btn" data-act="risk-note-save">שמור הערה ושם</button></div></div>' +
          statusLine +
        '</div>'
      );
    }

    var patientRound = 0;
    for (var i=0;i<dialogLines.length;i++){
      var ln = dialogLines[i];
      if (!ln) continue;

      if (ln.speaker === 'spacer'){
        html.push('<div class="line-spacer"></div>');
        continue;
      }

      var la = lineAttrs(ln);
      // Empty string for every line without a risk hit, so a plain line renders
      // exactly as before - no extra element and no extra marking.
      var riskRow = riskActionsRow(la.hit);

      if (ln.speaker === 'patient'){
        patientRound++;
        html.push('<div class="round-num" dir="ltr">' + patientRound + '.</div>');
        html.push('<div' + la.attrs + '><span class="speaker speaker-patient">' + escapeHtml(patientName) + ':</span> ' + escapeHtml(ln.body || '') + '</div>');
        html.push(riskRow);
        html.push('<div class="line-spacer"></div>');
      } else if (ln.speaker === 'therapist'){
        html.push('<div' + la.attrs + '><span class="speaker speaker-therapist">המטפל:</span> ' + escapeHtml(ln.body || '') + '</div>');
        html.push(riskRow);
      } else {
        html.push('<div' + la.attrs + '>' + escapeHtml(ln.body || '') + '</div>');
        html.push(riskRow);
      }

      if (la.hit){
        html.push(controlsForHit(la.hit.id, la.lineNum, la.hit));
      }
    }

    return html.join('');
  }


  function queryPage(forceReload){
    // בטעינה הראשונית: מביאים את הכל ללא סלקציה.
    // לאחר מכן: סלקציות מקומיות בלבד (ללא רשת).
    if (CACHE.loaded && !forceReload){
      rerenderFromCache();
      return;
    }
    loadAllDataFromServer().then(function(){
      rerenderFromCache();
    }).catch(function(){});
  }



  // SINGLE definition of "this risk still needs attention", extracted verbatim from the
  // allCanceled loop of the header risk pill. The pill and the risk_open row filter both
  // call it, so the two can never drift apart. VIEWED is the legacy spelling of REVIEWED.
  function isRiskStatusOpen(statusVal){
    var st = String(statusVal || 'NEW').trim();
    if (!st) st = 'NEW';
    return (st === 'NEW' || st === 'VIEWED' || st === 'REVIEWED');
  }

  function render(rows, flagsMap, infoMap, talkKind){
    return new Promise(function(resolve){
      var parts = [], alerts = [];
      var hiddenCount = 0, shownCount = 0;
      var patientsShown = new Set();

      // Row filter by CONVERSATION KIND. Replaces the old users_information_v2.status
      // filter entirely: source comes from conversations_session_v2 via CACHE.sourceMap,
      // track from users_information_v2.therapy_track via infoMap.
      //   all      -> every row
      //   course   -> src 'B'
      //   clinic   -> src 'A' and track 'CLINIC'
      //   nlp      -> src 'A' and track 'NLP_CBT'
      // risk_any and risk_open are NOT decided here - they need the risk rows of this
      // talk, which are loaded further down. See the risk gate inside nextRow().
      function isRowAllowed(row){
        // Default: no override. The old _forceRisk override of this filter is gone -
        // the rules above are absolute. _riskOverrideKind is still reset because the
        // header comment further down still refers to it.
        if (row) row._riskOverrideKind = false;

        var kind = String(talkKind || 'all').trim();
        if (!kind || kind === 'all' || kind === 'risk_any' || kind === 'risk_open') return true;

        var convId = (row && row.conversation_id != null) ? String(row.conversation_id).trim() : '';
        var srcRaw = (convId && CACHE.sourceMap) ? CACHE.sourceMap[convId] : '';
        var src = String(srcRaw == null ? '' : srcRaw).trim();

        if (kind === 'course') return (src === 'B');

        if (kind === 'clinic' || kind === 'nlp'){
          if (src !== 'A') return false;
          var codeKey = (row && row.patient_code != null) ? String(row.patient_code).trim() : '';
          var info = codeKey ? infoMap.get(codeKey) : null;
          var track = (info && info.therapy_track != null) ? String(info.therapy_track).trim() : '';
          return (kind === 'clinic') ? (track === 'CLINIC') : (track === 'NLP_CBT');
        }

        // Unknown value -> behave like 'all' rather than blanking the page.
        return true;
      }

      function nextRow(i){
        if (i >= rows.length){
          var totalHits = alerts.reduce(function(sum, a){ return sum + (a.items ? a.items.length : 0); }, 0);

          el.out.innerHTML = parts.join('') || '<div class="card hint">אין תוצאות.</div>';

          if (alerts.length){
            var top = ['<div class="alertbar"><h3>⚠️ נמצאו ' + totalHits + ' ביטויי סיכון ב-' + alerts.length + ' שיחות</h3>'];
            for (var a=0;a<alerts.length;a++){
              var AA = alerts[a];
              top.push('<div class="alertitem">');
              top.push('<div><strong>' + escapeHtml(AA.name) + '</strong> · <span dir="ltr">' + escapeHtml(AA.phone) + '</span> · המטפל: ' + escapeHtml(AA.psych || 'לא משויך') + '</div>');
              top.push('<div class="when">' + escapeHtml(AA.time) + '</div><div>');
              for (var z=0; z<AA.items.length; z++){
                var it = AA.items[z];
                // Severity word and tint, same table as the in-dialog RISK badge.
                // An empty, missing or unrecognised severity leaves both the text and
                // the class list exactly as they were before this block existed.
                var sevKey = String(it.severity || '').trim().toLowerCase();
                var sevWord = SEVERITY_WORD[sevKey];
                var chipCls = 'pill mono' + (sevWord ? (' sev-' + sevKey) : '');
                var chipTxt = it.text + (sevWord ? (' · ' + sevWord) : '');
                if (it.targetId){
                  top.push('<span class="' + chipCls + '" title="הקש לפתיחת הסיכון" role="button" tabindex="0" data-act="goto" data-target="' + escapeHtml(it.targetId) + '">' + escapeHtml(chipTxt) + '</span> ');
                } else {
                  top.push('<span class="' + chipCls + '" title="לא נמצא עוגן בטקסט">' + escapeHtml(chipTxt) + '</span> ');
                }
              }
              top.push('</div></div>');
            }
            top.push('</div>');
            el.alertHost.innerHTML = top.join('');
            function openRiskTarget(targetId){
              var node = targetId ? document.getElementById(targetId) : null;
              if (!node) return;

              // remove previous selection
              document.querySelectorAll('.risk-selected').forEach(function(n){ n.classList.remove('risk-selected'); });

              node.scrollIntoView({behavior:'smooth', block:'center'});
              node.classList.add('risk-selected');
              node.classList.add('target-blink');
              setTimeout(function(){ node.classList.remove('target-blink'); }, 1300);
            }

            el.alertHost.querySelectorAll('[data-act="goto"]').forEach(function(node){
              node.addEventListener('click', function(){
                openRiskTarget(node.getAttribute('data-target'));
              });
              node.addEventListener('keydown', function(ev){
                if (ev.key === 'Enter' || ev.key === ' '){
                  ev.preventDefault();
                  openRiskTarget(node.getAttribute('data-target'));
                }
              });
            });
          } else {
            el.alertHost.innerHTML = '';
          }

          resolve({ hiddenCount:hiddenCount, shownCount:shownCount, patientsCount: patientsShown.size });
          return;
        }

        var r = rows[i];
        if (!isRowAllowed(r)){ nextRow(i+1); return; }

        var talkClean = cleanTalk(r.last_talk_tzvira || '');
        var parsed = toDialogLines(identityFromMap(r).name, talkClean);
        var talkDomId = (r.time_key || '').replace(/[^0-9]/g,'') || Math.random().toString(36).slice(2);

        // Anchor IDs are based on the original line numbers ("-1-", "-2-", ...)
        applyAnchorsToDialogLines(parsed.lines, talkDomId);

        loadRiskRows(r.id, r.time_key, r.phone, r.patient_code).then(function(riskRows){
          var hits = bindRiskToDialog(parsed.lines, talkDomId, riskRows);

          // open risks for alerts: status NEW or VIEWED (or REVIEWED) 
          var notRev = [];
          for (var h=0; h<hits.length; h++){
            var st = String(hits[h].status || 'NEW').trim();
            if (st === 'NEW' || st === 'VIEWED' || st === 'REVIEWED') notRev.push(hits[h]);
          }

          // Row filter, risk half. It lives here and not in isRowAllowed() because it
          // needs `hits`, which only exists once loadRiskRows has resolved for this talk.
          // Placed before the header is emitted and before any counter is touched, so a
          // row dropped here is never counted.
          //   risk_any  -> the talk has at least one risk row, handled or not
          //   risk_open -> at least one of them is still open, per isRiskStatusOpen()
          if (talkKind === 'risk_any' || talkKind === 'risk_open'){
            var keepByRisk = false;
            if (hits && hits.length){
              if (talkKind === 'risk_any'){
                keepByRisk = true;
              } else {
                for (var rq=0; rq<hits.length; rq++){
                  if (isRiskStatusOpen(hits[rq].status)){ keepByRisk = true; break; }
                }
              }
            }
            if (!keepByRisk){ nextRow(i+1); return; }
          }

          var k = keyOf(r.time_key, r.patient_code);
          var flag = k ? flagsMap.get(k) : null;   // no patient_code -> treated as not hidden
          var isHidden = !!(flag && flag.is_hidden);

          // Toolbar filter: drop talks that are marked hidden AND carry no open risk.
          // Placed here on purpose: after isHidden and notRev are both known, and
          // before the header is emitted and before hiddenCount is incremented, so a
          // row skipped here is never counted as a hidden talk in the count line.
          if (HIDE_SEEN && isHidden && notRev.length === 0){ nextRow(i+1); return; }

          // Display-only. All join keys (riskKey/keyOf) and all server writes now use patient_code.
          var ident = displayIdentity(r);

          if (!isHidden && notRev.length){
            var items = [];
            for (var nn=0; nn<notRev.length; nn++){
              var hh2 = notRev[nn];
              items.push({
                text: (hh2.risk_reasons || hh2.short_risk || ('line ' + hh2.line_num)),
                targetId: hh2.targetId || '',
                reviewer: (hh2.reviewer != null ? String(hh2.reviewer).trim() : ''),
                // Already present on the hit (bindRiskToDialog) and already in both
                // SELECT lists. It was simply being dropped here.
                severity: (hh2.severity != null ? String(hh2.severity) : '')
              });
            }
            alerts.push({
              name: ident.name || 'מטופל/ת',
              phone: ident.phone || '',
              psych: psychNameFor(r),
              time: timeKeyToHuman(r.time_key),
              items: items
            });
          }

          var nameHtml  = '<span class="patient-name">' + escapeHtml(ident.name || 'מטופל/ת') + '</span>';
          var phoneHtml = '<span class="patient-phone" dir="ltr">' + escapeHtml(ident.phone || '') + '</span>';
          // Display-only, appended after the existing name and phone. displayIdentity
          // is untouched and still the sole source of the name and the phone.
          var psychHtml = '<span class="patient-psych"> · המטפל: ' + escapeHtml(psychNameFor(r) || 'לא משויך') + '</span>';
          var btnLabel  = isHidden ? 'הצג שיחה' : 'הסתר שיחה';

          var rawHasContent = !!(r.summarized_linked_talk && String(r.summarized_linked_talk).trim());

          var headParts = [];
          headParts.push('<div class="head">');
          headParts.push('<div class="head-name">', nameHtml, '</div>');
          headParts.push('<div class="head-sep">·</div>');
          headParts.push('<div class="head-phone">', phoneHtml, '</div>');
          headParts.push('<div class="head-psych">', psychHtml, '</div>');
                              // סוג השיחה, לכל שיחה בנפרד:
          // מקור השיחה מ-conversations_session_v2.source דרך CACHE.sourceMap (מפתח conversation_id),
          // ומסלול הטיפול מ-users_information_v2.therapy_track דרך infoMap (מפתח patient_code).
          //   source = 'B'                        -> 'הדרכת קורס'
          //   source = 'A' ומסלול לא ריק          -> ערך המסלול הגולמי, מודפס כפי שהוא
          //   כל שאר המקרים                        -> 'לא ידוע'
          // אין מיפוי ואין תרגום של ערך המסלול, ואין נפילה חזרה לערך הסלקציה (fKind).
          var kindTxt = 'לא ידוע';
          try{
            var convId = (r && r.conversation_id != null) ? String(r.conversation_id).trim() : '';
            var srcRaw = (convId && CACHE.sourceMap) ? CACHE.sourceMap[convId] : '';
            var src = String(srcRaw == null ? '' : srcRaw).trim();
            if (src === 'B'){
              kindTxt = 'הדרכת קורס';
            } else if (src === 'A'){
              var info2 = infoMap.get((r && r.patient_code != null) ? String(r.patient_code).trim() : '');
              // Raw value, printed verbatim. trim() is used for the emptiness test only.
              var trackRaw = (info2 && info2.therapy_track != null) ? String(info2.therapy_track) : '';
              if (trackRaw.trim() !== '') kindTxt = trackRaw;
            }
          } catch(e){}
          /* kind override exists (row._riskOverrideKind) but we no longer prefix UI with 'RISK override'. */
          headParts.push('<div class="meta why">', escapeHtml(kindTxt), '</div>');

          // Show risk title pill
          // - If there is at least one risk with status NEW or VIEWED  => "נמצא גורם סיכון"
          // - If all risks are deleted => "גורם סיכון טופל"
          if (hits && hits.length){
            var allCanceled = true;
            for (var rc=0; rc<hits.length; rc++){
              // Same single test the risk_open row filter uses. See isRiskStatusOpen().
              if (isRiskStatusOpen(hits[rc].status)){
                allCanceled = false;
                break;
              }
            }
            var pillTxt = allCanceled ? 'גורם סיכון טופל' : 'נמצא גורם סיכון';
            headParts.push('<div class="meta"><span class="pill">' + escapeHtml(pillTxt) + '</span></div>');
          }

          var canToggle = (isHidden || (!isHidden && notRev.length === 0));
          var canSumm   = (!isHidden && notRev.length === 0);
          var canRaw    = (!isHidden && rawHasContent);

          if (canToggle) {
            headParts.push(
              '<button class="btn-toggle btn-state-active" data-time="', escapeHtml(r.time_key),
              '" data-phone="', escapeHtml(r.phone||''),
              '" data-name="', escapeHtml(r.name||''),
              '" data-hidden="', (isHidden?'1':'0'),
              '" data-notrev="', (notRev.length), '">', btnLabel, '</button>'
            );
          } else {
            headParts.push('<button class="btn-placeholder">' + btnLabel + '</button>');
          }

          if (canSumm) {
            headParts.push('<button class="btn-summarized_linked_talk btn-state-active" data-notrev="0">הצג מקוצרת</button>');
          } else {
            headParts.push('<button class="btn-placeholder">הצג מקוצרת</button>');
          }

          if (canRaw) {
            headParts.push('<button class="btn-raw-summary btn-state-active" title="הצג את summarized_linked_talk כפי שהוא">הצג שיחות קודמות</button>');
          } else {
            headParts.push('<button class="btn-placeholder">הצג שיחות קודמות</button>');
          }

          headParts.push('<span class="meta mono">', escapeHtml(timeKeyToHuman(r.time_key)), '</span>');
          headParts.push('<button class="btn-home" title="חזרה למסך הראשון">חזרה למסך הראשון</button>');
          headParts.push('</div>');

          parts.push('<div class="talk" data-id="' + escapeHtml(r.id||'') + '" data-time_key="' + escapeHtml(r.time_key||'') + '" data-time="' + escapeHtml(r.time_key||'') + '" data-phone="' + escapeHtml(r.phone||'') + '" data-name="'+escapeHtml(r.name||'')+'" data-patient_code="' + escapeHtml(r.patient_code == null ? '' : String(r.patient_code)) + '">');
          parts.push(headParts.join(''));

          // Count distinct patients by patient_code, for EVERY row whose header was
          // emitted above - a patient whose talks are all hidden still owns a header,
          // so counting inside the isHidden branch below would lose that patient.
          // name/phone are shadow columns pending removal and are already null on some
          // rows, so there is NO fallback to phone.
          var pcKey = (r && r.patient_code != null) ? String(r.patient_code).trim() : '';
          if (pcKey) patientsShown.add(pcKey);

          if (isHidden){
            hiddenCount++;
          } else {
            shownCount++;
            var dialogHtml = renderDialogHtml(parsed.patient, parsed.lines, hits);
            dialogHtml = dialogHtml.replace(/__TALKDOM__-/g, 'ln-' + talkDomId + '-');
            parts.push('<div class="body">' + dialogHtml + '</div>');

            var sumRaw = (r.summarized_linked_talk || '').trim();
            var sumCut = sliceSummaryFromLastMarker(sumRaw);
            var sumHtml = sumCut ? escapeHtml(sumCut) : '<span class="empty">אין סיכום שיחה.</span>';
            var sumRawB64 = b64Enc(sumRaw);
            parts.push('<div class="summarized_linked_talk" data-raw-b64="'+escapeHtml(sumRawB64)+'">'+ sumHtml +'</div>');
          }

          parts.push('</div>');
          nextRow(i+1);
        });
      }

      nextRow(0);
    });
  }

  // האזנות על רשימת התוצאות
  el.out.addEventListener('click', function(ev){
    var btnHome = ev.target.closest('.btn-home');
    if (btnHome){
      el.fPhone.value=''; el.fName.value=''; el.fFrom.value=''; el.fTo.value='';
      queryPage(true);
      window.scrollTo({top:0, behavior:'smooth'});
      return;
    }

    var btnToggle = ev.target.closest('.btn-toggle');
    if (btnToggle){
      var talkElem = btnToggle.closest('.talk');
      var time_key = btnToggle.getAttribute('data-time');
      var phone    = btnToggle.getAttribute('data-phone');
      var pCode    = talkElem ? String(talkElem.getAttribute('data-patient_code') || '').trim() : '';
      var name     = btnToggle.getAttribute('data-name') || null;
      var isHidden = btnToggle.getAttribute('data-hidden') === '1';
      var notRevCount = parseInt(btnToggle.getAttribute('data-notrev')||'0',10);

      if (!isHidden && notRevCount > 0){
        showInlineMsg(talkElem, 'לא ניתן להסתיר שיחה כל עוד קיימים ביטויי סיכון שלא טופלו.');
        return;
      }

      // HARD GUARD: this is a DB write. No patient_code -> the request is never sent,
      // and there is NO fallback to phone.
      if (!pCode){
        showInlineMsg(talkElem, 'חסר מזהה מטופל (patient_code) בשיחה זו — לא ניתן לשנות את מצב ההצגה.');
        return;
      }

      // phone is no longer written: the shadow column is being dropped.
      var payload = { time_key: time_key, patient_code: pCode, is_hidden: !isHidden, toggled_by: 'viewer_default', patient_name: name };

      supa.from(FLAGS_TABLE)
          .upsert(payload, { onConflict: 'time_key,patient_code' })
          .then(function(res2){
            if (res2.error){
              showInlineMsg(talkElem, 'שגיאה בעדכון מצב השיחה: ' + (res2.error.message || 'unknown'));
              return;
            }
            if (CACHE && CACHE.loaded){
              CACHE.flagsMap.set(keyOf(time_key, pCode), { is_hidden: !isHidden });
              rerenderFromCache();
            } else {
              queryPage(true);
            }
          });
      return;
    }

    var btnSumm = ev.target.closest('.btn-summarized_linked_talk');
    if (btnSumm){
      var talk = btnSumm.closest('.talk');
      var body = talk.querySelector('.body');
      var sum  = talk.querySelector('.summarized_linked_talk');
      if (body && sum){
        var showingFull = (body.style.display !== 'none');
        if (showingFull){
          body.style.display = 'none';
          sum.style.display  = 'block';
          btnSumm.textContent = 'הצג מלאה';
          btnSumm.classList.add('btn-selected');
        } else {
          sum.style.display  = 'none';
          body.style.display = 'block';
          btnSumm.textContent = 'הצג מקוצרת';
          btnSumm.classList.remove('btn-selected');
        }
      }
      return;
    }

    var btnRaw = ev.target.closest('.btn-raw-summary');
    if (btnRaw){
      var talk2 = btnRaw.closest('.talk');
      var body2 = talk2.querySelector('.body');
      var sum2  = talk2.querySelector('.summarized_linked_talk');
      if (!sum2) return;

      var showingRaw = btnRaw.getAttribute('data-showing') === '1';
      if (!showingRaw){
        var rawB64 = sum2.getAttribute('data-raw-b64') || '';
        var rawTxt = b64Dec(rawB64);
        if (!rawTxt){ showInlineMsg(talk2, 'אין תוכן סיכום שיחות'); return; }

        if (body2) body2.style.display = 'none';
        sum2.style.display = 'block';
        sum2.textContent   = rawTxt;
        btnRaw.textContent = 'הצג שיחה';
        btnRaw.setAttribute('data-showing','1');
        btnRaw.classList.add('btn-selected');
      } else {
        if (sum2)  sum2.style.display  = 'none';
        if (body2) body2.style.display = 'block';
        btnRaw.textContent = 'הצג שיחות קודמות';
        btnRaw.setAttribute('data-showing','0');
        btnRaw.classList.remove('btn-selected');
      }
      return;
    }



    // Inline risk controls: save note button
    var btnRiskNoteSave = ev.target.closest('button[data-act="risk-note-save"]');
    if (btnRiskNoteSave){
      var boxN = btnRiskNoteSave.closest('.risk-controls');
      var talkIdN = boxN ? boxN.getAttribute('data-id') : null;
      var timeKeyN = null;
      var phoneN = null;
      try{
        var talkElN = btnRiskNoteSave.closest('.talk');
        timeKeyN = talkElN ? (talkElN.getAttribute('data-time_key') || talkElN.getAttribute('data-time') || null) : null;
        phoneN = talkElN ? (talkElN.getAttribute('data-phone') || null) : null;
      }catch(e){}
      var lnN = boxN ? parseInt(boxN.getAttribute('data-ln')||'0',10) : 0;
      var taN = boxN ? boxN.querySelector('textarea[data-act="risk-note"]') : null;
      var txtN = taN ? (taN.value || '') : '';
      var talkElemN = btnRiskNoteSave.closest('.talk');
      var timeKeyN = talkElemN ? (talkElemN.getAttribute('data-time_key') || talkElemN.getAttribute('data-time') || '') : '';
      var phoneN = talkElemN ? (talkElemN.getAttribute('data-phone') || '') : '';
      var pCodeN = talkElemN ? (talkElemN.getAttribute('data-patient_code') || '') : '';

      // Require explanation note (min 10 chars) before saving notes
      var noteTrimN = String(txtN || '').trim();
      if (noteTrimN.length < 10){
        clearInlineMsgNearRiskBox(boxN);
        showInlineMsgNearRiskBox(boxN, 'יש להקיש הערה יותר מ- 10 תווים');
        try{ if (taN) taN.focus(); }catch(e){}
        return;
      }
      clearInlineMsgNearRiskBox(boxN);

      // Abort before any network call if the talk has no patient_code.
      if (!String(pCodeN || '').trim()){
        showInlineMsgNearRiskBox(boxN, 'חסר מזהה מטופל (patient_code) בשיחה זו — לא ניתן לשמור.');
        return;
      }
      updateRiskReviewNotes(talkIdN, timeKeyN, phoneN, lnN, noteTrimN, pCodeN).then(function(ok){
        if (!ok){
          showInlineMsgNearRiskBox(boxN, 'לא עודכנה הערה (לא נמצאה שורה מתאימה).');
          return;
        }
        // visual feedback
        btnRiskNoteSave.textContent = 'נשמר ✔';
        setTimeout(function(){ try{ btnRiskNoteSave.textContent = 'שמור הערה ושם'; }catch(e){} }, 1200);
        if (CACHE && CACHE.loaded){ rerenderFromCache(); } else { queryPage(true); }
      }).catch(function(e){
        showInlineMsgNearRiskBox(boxN, 'שגיאה בעדכון הערה: ' + (e && e.message ? e.message : e));
      });
      return;
    }

    // Inline risk controls: status buttons
    var btnRiskStatus = ev.target.closest('button[data-act="risk-status"]');
    if (btnRiskStatus){
      var box = btnRiskStatus.closest('.risk-controls');
      var talkId = box ? box.getAttribute('data-id') : null;
      var timeKeyX = null;
      var phoneX = null;
      try{
        var talkElX = btnRiskStatus.closest('.talk');
        timeKeyX = talkElX ? (talkElX.getAttribute('data-time_key') || talkElX.getAttribute('data-time') || null) : null;
        phoneX = talkElX ? (talkElX.getAttribute('data-phone') || null) : null;
      }catch(e){}
      var ln = box ? parseInt(box.getAttribute('data-ln')||'0',10) : 0;
      var newStatus = btnRiskStatus.getAttribute('data-status') || '';
      var talkElemX = btnRiskStatus.closest('.talk');
      var timeKeyX = talkElemX ? (talkElemX.getAttribute('data-time_key') || talkElemX.getAttribute('data-time') || '') : '';
      var phoneX = talkElemX ? (talkElemX.getAttribute('data-phone') || '') : '';
      var pCodeX = talkElemX ? (talkElemX.getAttribute('data-patient_code') || '') : '';

      // Require explanation note (min 10 chars) for both actions
      var taReq = box ? box.querySelector('textarea[data-act="risk-note"]') : null;
      var noteTxt = taReq ? String(taReq.value || '').trim() : '';
      if (noteTxt.length < 10){
        clearInlineMsgNearRiskBox(box);
        showInlineMsgNearRiskBox(box, 'יש להקיש הערה יותר מ- 10 תווים');
        try{ if (taReq) taReq.focus(); }catch(e){}
        return;
      }
      clearInlineMsgNearRiskBox(box);
      // Abort before any network call AND before the optimistic UI, so no false "active" state is left behind.
      if (!String(pCodeX || '').trim()){
        clearInlineMsgNearRiskBox(box);
        showInlineMsgNearRiskBox(box, 'חסר מזהה מטופל (patient_code) בשיחה זו — לא ניתן לעדכן סטטוס.');
        return;
      }
      // optimistic UI: mark selected button
      try{
        if (box){ box.querySelectorAll('button[data-act="risk-status"]').forEach(function(b){ b.classList.remove('active'); }); }
        btnRiskStatus.classList.add('active');
      }catch(e){}

      // Update labels immediately per requirement
      try{
        var btnSeen = box ? box.querySelector('button[data-act=\"risk-status\"][data-status=\"צפיתי\"]') : null;
        var btnCancel = box ? box.querySelector('button[data-act=\"risk-status\"][data-status=\"מבטל סיכון\"]') : null;
        var cur = box ? box.querySelector('.rc-current') : null;
        if (newStatus === 'צפיתי'){
          if (btnSeen) btnSeen.textContent = 'צפיתי';
          if (btnCancel) btnCancel.textContent = 'ביטול סיכון';
          if (cur) cur.innerHTML = 'סטטוס נוכחי: <span class=\"rc-status\">צפיתי</span>';
        } else if (newStatus === 'מבטל סיכון'){
          if (btnCancel) btnCancel.textContent = 'ביטלתי סיכון';
          if (btnSeen) btnSeen.textContent = 'צפייה';
          if (cur) cur.innerHTML = 'סטטוס נוכחי: <span class=\"rc-status\">מבטל סיכון</span>';
        }
      }catch(e){}

      updateRiskReviewStatus(talkId, timeKeyX, phoneX, ln, newStatus, noteTxt, pCodeX).then(function(ok){
        if (!ok){
          showInlineMsgNearRiskBox(box, 'לא עודכן סטטוס (לא נמצאה שורה מתאימה).');
          try{ btnRiskStatus.classList.remove('active'); }catch(e){}
          return;
        }
        if (CACHE && CACHE.loaded){ rerenderFromCache(); } else { queryPage(true); }
      }).catch(function(e){
        showInlineMsgNearRiskBox(box, 'שגיאה בעדכון סטטוס: ' + (e && e.message ? e.message : e));
        try{ btnRiskStatus.classList.remove('active'); }catch(e2){}
      });
      return;
    }

        var btnReview = ev.target.closest('.btn-review-inline');
    if (btnReview){
      var talkElem2 = btnReview.closest('.talk');
      showInlineMsg(talkElem2, 'בגרסה זו: תצוגה בלבד (אין עדכון סטטוס מה-Viewer).');
      return;
    }

    var btnUnreview = ev.target.closest('.btn-unreview-inline');
    if (btnUnreview){
      var talkElem3 = btnUnreview.closest('.talk');
      showInlineMsg(talkElem3, 'בגרסה זו: תצוגה בלבד (אין עדכון סטטוס מה-Viewer).');
      return;
    }

  // Save risk notes on textarea blur (focusout)
  // במכוון: לא שומרים אוטומטית. משתמשים בכפתור "שמור הערה".
  el.out.addEventListener('focusout', function(ev){ return; }, true);


  });

  el.fKind.addEventListener('change', function(){
    try {
      if (window.localStorage) localStorage.setItem(LS_STATUS_KEY, el.fKind.value || '');
    } catch(e) {}
    updateTitlesFromStatus();
    if (CACHE && CACHE.loaded){ rerenderFromCache(); } else { queryPage(true); }
  });

  el.btnRun.onclick   = function(){ queryPage(true); };
  el.btnClear.onclick = function(){
    el.fPhone.value=''; el.fName.value=''; el.fFrom.value=''; el.fTo.value='';
    if (CACHE && CACHE.loaded){ rerenderFromCache(); } else { queryPage(true); }
  };

  updateTitlesFromStatus();


  // Cache-busting badge: show ?v=... near the version label (testing visibility)
  (function(){
    try{
      var sp = new URLSearchParams(window.location.search || "");
      var v = sp.get("v");
      var badge = document.getElementById("vBadge");
      if (badge && v){ badge.textContent = " · v=" + String(v); }
    }catch(e){}
  })();

  // Version stamp: the last commit that touched THIS file, shown in Israel time.
  // Display-only, additive, and non-blocking: any failure (offline, rate limit,
  // private repo, unexpected payload) falls back to a static text and never
  // interferes with queryPage() or the load chain.
  (function(){
    var COMMITS_URL = 'https://api.github.com/repos/yaki-tamir-levy/landbot-runner/commits?path=users_viewer_tzvira_v2.html&per_page=1';
    var elStamp = document.getElementById('commitStamp');
    if (!elStamp) return;

    function stampUnavailable(e){
      console.warn('commit stamp unavailable: ' + (e && e.message ? e.message : e));
      elStamp.textContent = 'גרסה לא זמינה';
    }

    try{
      fetch(COMMITS_URL, { headers: { 'Accept': 'application/vnd.github+json' } })
        .then(function(res){
          if (!res.ok) throw new Error('github http ' + res.status);
          return res.json();
        })
        .then(function(list){
          var c = (list && list.length) ? list[0] : null;
          var utc = (c && c.commit && c.commit.committer) ? c.commit.committer.date : '';
          var sha = (c && c.sha) ? String(c.sha).slice(0, 7) : '';
          if (!utc || !sha) throw new Error('unexpected github payload');
          var d = new Date(utc);
          if (isNaN(d.getTime())) throw new Error('bad commit date: ' + utc);
          // Explicit timeZone: the stamp must read identically for every viewer,
          // independent of the time zone of the machine looking at the page.
          var israel = d.toLocaleString('he-IL', { timeZone: 'Asia/Jerusalem' });
          elStamp.textContent = 'עודכן: ' + israel + ' · ' + sha;
        })
        .catch(stampUnavailable);
    }catch(e){
      stampUnavailable(e);
    }
  })();

  // init אחרי שה-DOM מוכן (למקרה של race)
  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', function(){ queryPage(true); });
  } else {
    queryPage(true);
  }
})();
</script>
