<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BOT Monitor</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #eee;
      font-family: Arial, sans-serif;
      font-size: 16px;
    }
    header {
      position: sticky;
      top: 0;
      background: #111;
      padding: 16px;
      border-bottom: 1px solid #333;
      z-index: 10;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 22px;
    }
    .meta {
      color: #aaa;
      font-size: 13px;
      line-height: 1.5;
    }
    main {
      padding: 12px;
    }
    .card {
      border: 1px solid #333;
      border-radius: 12px;
      margin-bottom: 12px;
      padding: 14px;
      background: #1b1b1b;
    }
    .card.completed {
      border-left: 5px solid #2ecc71;
    }
    .card.running {
      border-left: 5px solid #f39c12;
    }
    .card-head {
      margin-bottom: 12px;
    }
    .card-title {
      font-weight: bold;
      font-size: 18px;
      line-height: 1.35;
      margin-bottom: 6px;
    }
    .card-sub {
      color: #ccc;
      font-size: 13px;
      line-height: 1.6;
    }
    .source {
      font-weight: bold;
    }
    .event {
      padding: 8px 0;
      border-top: 1px solid #2c2c2c;
    }
    small {
      color: #999;
      font-size: 12px;
    }
    .error {
      border: 1px solid #c0392b;
      background: #2a1515;
      border-radius: 12px;
      padding: 14px;
      color: #ffd6d6;
    }
  </style>
</head>
<body>
  <header>
    <h1>BOT Monitor</h1>
    <div class="meta" id="meta">Loading...</div>
  </header>

  <main id="app"></main>

  <script>
    const SUPABASE_URL = "https://qcwimczsiuxkarwfiyai.supabase.co";

    // Public anon key. Already published in login_phone_v2.html line 49;
    // repeating it here adds no exposure. It is not what grants access -
    // get_bot_monitor_events() is granted to authenticated only, and its
    // body filters on current_user_is_admin().
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFjd2ltY3pzaXV4a2Fyd2ZpeWFpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTM1OTEwMzgsImV4cCI6MjA2OTE2NzAzOH0.zpMcORTD1voqZFj5QaPUc-EXf1juqnlTTP00jV6_TvI";

    const API_URL = `${SUPABASE_URL}/functions/v1/bot-monitor`;
    const REFRESH_MS = 10000;

    // This page sits one directory below the repository root; the login
    // page sits at the root. Both hops verified against URL resolution.
    const LOGIN_PATH = "../login_phone_v2.html";
    const RETURN_TO = "monitor/index.html";

    let supabase = null;
    let refreshTimer = null;

    function goToLogin() {
      if (refreshTimer !== null) {
        clearInterval(refreshTimer);
        refreshTimer = null;
      }

      window.location.replace(
        `${LOGIN_PATH}?return_to=${encodeURIComponent(RETURN_TO)}`,
      );
    }

    function showError(message) {
      const app = document.getElementById("app");
      app.innerHTML =
        `<div class="error">${escapeHtml(message)}</div>`;
    }

    function formatTime(value) {
      const date = value ? new Date(value) : new Date();
      return date.toLocaleTimeString("he-IL");
    }

    function formatHeaderDate(value) {
      if (!value) return "";

      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);

      const parts = new Intl.DateTimeFormat("he-IL", {
        timeZone: "Asia/Jerusalem",
        year: "2-digit",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false,
      }).formatToParts(date);

      const part = (type) =>
        parts.find((item) => item.type === type)?.value ?? "";

      return `${part("day")}.${part("month")}.${part("year")} ${part("hour")}:${part("minute")}`;
    }

    function sourceLabel(value) {
      const source = String(value ?? "").trim().toUpperCase();

      if (source === "A") return "מטפל וירטואלי";
      if (source === "B") return "מדריך קורס";

      return source;
    }

    function displayStatus(value) {
      const status = String(value ?? "").trim();

      if (!status) return "";
      if (status.toLowerCase() === "completed") return "completed";
      if (status.toLowerCase() === "running") return "running";

      return status;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function firstEvent(conversation) {
      return conversation?.events?.[0] ?? {};
    }

    function conversationStartedAt(conversation) {
      const event = firstEvent(conversation);

      return conversation.started_at
        ?? conversation.process_started_at
        ?? event.started_at
        ?? event.process_started_at
        ?? event.created_at
        ?? "";
    }

    function conversationSource(conversation) {
      const event = firstEvent(conversation);
      return conversation.source ?? event.source ?? "";
    }

    function conversationStatus(conversation) {
      const event = firstEvent(conversation);

      return conversation.conversation_status
        ?? event.conversation_status
        ?? conversation.status
        ?? "";
    }

    function conversationPhone(conversation) {
      const event = firstEvent(conversation);
      return conversation.phone_masked ?? event.phone_masked ?? "";
    }

    function render(data) {
      const meta = document.getElementById("meta");
      const app = document.getElementById("app");

      meta.textContent =
        `Conversation Trace - Version 1.5 ${data.version} - Last refresh: ${formatTime(data.refreshed_at)}`;

      if (!data.conversations || data.conversations.length === 0) {
        app.innerHTML = "<p>No events found.</p>";
        return;
      }

      app.innerHTML = data.conversations.map((conversation) => {
        const startedAt =
          formatHeaderDate(conversationStartedAt(conversation));

        const source =
          sourceLabel(conversationSource(conversation));

        const status =
          displayStatus(conversationStatus(conversation));

        const phone =
          conversationPhone(conversation);

        const psychologistName =
          String(conversation.psychologist_name ?? "").trim();

        const conversationLabel =
          `Conversation ${conversation.conversation_suffix}`;

        const titleParts = [
          startedAt,
          `${conversationLabel}${status ? ` ${status}` : ""}`,
        ].filter(Boolean);

        const title = titleParts.join(" | ");

        return `
          <section class="card ${conversation.completed ? "completed" : "running"}">
            <div class="card-head">
              <div class="card-title">
                ${escapeHtml(title)}
              </div>

              <div class="card-sub">
                ${source ? `<div class="source">${escapeHtml(source)}</div>` : ""}
                ${psychologistName ? `<div>מטפל: ${escapeHtml(psychologistName)}</div>` : ""}
                <div>${escapeHtml(phone)}</div>
              </div>
            </div>

            <div class="events">
              ${conversation.events.map((event) => `
                <div class="event">
                  <div>${escapeHtml(event.event_title)}</div>
                  <small>${escapeHtml(event.source_table)}</small>
                </div>
              `).join("")}
            </div>
          </section>
        `;
      }).join("");
    }

    async function loadMonitor() {
      try {
        // Re-read the session every cycle rather than caching the token,
        // so an access token refreshed in the background is picked up.
        const { data: sessionData, error: sessionError } =
          await supabase.auth.getSession();

        if (sessionError) throw sessionError;

        const session = sessionData && sessionData.session;
        if (!session || !session.access_token) {
          goToLogin();
          return;
        }

        const response = await fetch(`${API_URL}?t=${Date.now()}`, {
          method: "GET",
          cache: "no-store",
          headers: {
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": `Bearer ${session.access_token}`,
          },
        });

        if (response.status === 401 || response.status === 403) {
          goToLogin();
          return;
        }

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        render(data);
      } catch (error) {
        showError(`Failed to load BOT Monitor: ${error.message}`);
      }
    }

    async function init() {
      if (!window.supabase ||
          typeof window.supabase.createClient !== "function") {
        showError(
          "Supabase library did not load. Reload the page and try again.",
        );
        return;
      }

      supabase = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true,
          },
        },
      );

      const { data: sessionData } = await supabase.auth.getSession();

      if (!sessionData || !sessionData.session) {
        goToLogin();
        return;
      }

      await loadMonitor();
      refreshTimer = setInterval(loadMonitor, REFRESH_MS);
    }

    init();
  </script>
</body>
</html>
