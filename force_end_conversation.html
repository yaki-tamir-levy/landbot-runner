<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Force End - TEST ONLY</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.1/dist/umd/supabase.js"></script>
<style>
  body{font:15px system-ui,sans-serif;background:#fafafa;margin:0;padding:24px}
  .card{max-width:480px;margin:60px auto;background:#fff;border:1px solid #ddd;
        border-radius:10px;padding:24px;text-align:center}
  .warn{background:#fff8e1;border:1px solid #e0b400;border-radius:6px;
        padding:10px;margin-bottom:20px;text-align:start}
  button{font-size:18px;padding:14px 32px;cursor:pointer}
  button:disabled{opacity:.5;cursor:not-allowed}
  #out{margin-top:20px;font-size:16px;min-height:48px}
  .bad{color:#b00}.good{color:#0a6}
</style>
</head>
<body>
<div class="card">
  <div class="warn"><b>TEST ONLY</b> - ends every conversation currently
  waiting in the transit table. Do not use on real patient data.</div>

  <div id="auth">Checking session...</div>

  <div id="panel" style="display:none">
    <button id="go" type="button">Force End All</button>
    <div id="out">Ready.</div>
  </div>
</div>

<script>
(async function(){
  "use strict";
  var SUPABASE_URL = "https://qcwimczsiuxkarwfiyai.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFjd2ltY3pzaXV4a2Fyd2ZpeWFpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTM1OTEwMzgsImV4cCI6MjA2OTE2NzAzOH0.zpMcORTD1voqZFj5QaPUc-EXf1juqnlTTP00jV6_TvI";
  var supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var authBox = document.getElementById('auth');
  var panel   = document.getElementById('panel');
  var out     = document.getElementById('out');
  var btn     = document.getElementById('go');

  var s = await supa.auth.getSession();
  if (!s || !s.data || !s.data.session) {
    authBox.className = 'bad';
    authBox.innerHTML = 'No active session. Log in first via ' +
      '<a href="login_phone_v2.html">login_phone_v2.html</a>, then reopen this page.';
    return;
  }
  authBox.className = 'good';
  authBox.textContent = 'Session active: ' + (s.data.session.user.email || 'unknown');
  panel.style.display = 'block';

  btn.addEventListener('click', async function(){
    btn.disabled = true;
    out.className = '';
    out.textContent = 'Running...';
    try {
      var r = await supa.rpc('force_end_all_conversations_v2');
      if (r.error) {
        out.className = 'bad';
        out.textContent = 'RPC ERROR: ' + r.error.message;
        return;
      }
      var d = r.data;
      if (!d || d.ok !== true) {
        out.className = 'bad';
        out.textContent = 'FAILED: ' + (d && d.error ? d.error : 'unknown');
        return;
      }
      out.className = 'good';
      out.textContent = 'Done. Conversations: ' + d.conversations +
                        ' | Messages shifted: ' + d.messages_shifted;
    } catch (e) {
      out.className = 'bad';
      out.textContent = 'EXCEPTION: ' + e.message;
    } finally {
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
